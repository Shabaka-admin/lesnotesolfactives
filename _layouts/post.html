---
layout: default
---
<article class="fam-{{ page.famille }}">
<h1>{{ page.title }}</h1>
<p class="meta">Publié le {{ page.date | date: "%d/%m/%Y" }}</p>
{{ content }}
</article>
<section class="more">
<h2>À lire aussi</h2>
<ul>{% for p in site.posts %}{% if p.url != page.url %}<li><a href="{{ p.url }}">{{ p.title }}</a></li>{% endif %}{% endfor %}</ul>
</section>
